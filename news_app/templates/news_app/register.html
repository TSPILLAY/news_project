{% extends 'news_app/base.html' %}

{% block title %}Register - News App{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Register for News Application</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success" style="width: 100%;">Register</button>
    </form>
    <p style="margin-top: 15px;">Already have an account? <a href="{% url 'login' %}">Log in here</a></p>
</div>
{% endblock %}
