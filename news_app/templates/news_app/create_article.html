{% extends 'news_app/base.html' %}

{% block title %}Submit Article{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Submit Article for Approval</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn" style="width: 100%;">Submit Article</button>
    </form>
    <p style="margin-top: 15px;"><a href="{% url 'article_list' %}">Back to Feed</a></p>
</div>
{% endblock %}
