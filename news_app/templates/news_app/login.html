{% extends 'base.html' %}

{% block title %}Login - News App{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Login to Your Account</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn" style="width: 100%;">Log In</button>
    </form>
    <p style="margin-top: 15px;">Need an account? <a href="{% url 'register' %}">Register here</a></p>
</div>
{% endblock %}
