{% for article in articles %}
    <div class="article-card">
        <h2>{{ article.title }}</h2>
        <p>{{ article.content }}</p>
        {% if user.role == 'editor' %}
            <a href="{% url 'editor_edit_article' article.id %}">Edit Live Article</a>
            <a href="{% url 'editor_delete_article' article.id %}">Delete Article</a>
        {% endif %}
    </div>
{% endfor %}
