{% extends 'news_app/base.html' %}

{% block title %}Curate Newsletter{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Curate a Newsletter</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success" style="width: 100%;">Publish Newsletter</button>
    </form>
    <p style="margin-top: 15px;"><a href="{% url 'newsletter_list' %}">Back to Newsletters</a></p>
</div>
{% endblock %}
