{% extends 'base.html' %}

{% block title %}Edit Newsletter{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Edit Newsletter: {{ newsletter.title }}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-warning" style="width: 100%;">Update Newsletter</button>
    </form>
    <p style="margin-top: 15px;"><a href="{% url 'newsletter_list' %}">Cancel</a></p>
</div>
{% endblock %}
